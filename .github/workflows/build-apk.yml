name: Build Android Debug & Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode Repositori
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Beri Izin Eksekusi Gradlew (Jika Ada)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Generate Gradle Wrapper Jika Belum Ada
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.5
            chmod +x ./gradlew
          fi

      - name: Kompilasi APK Debug (assembleDebug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Unggah Artefak APK Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: PlaKeyboardPro-APK
          path: app/build/outputs/apk/debug/*.apk
